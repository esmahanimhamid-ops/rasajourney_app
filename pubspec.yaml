name: rasajourney_app
description: A Flutter project

environment:
  sdk: '^3.11.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.30.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_storage: ^11.6.0

  # Maps
  google_maps_flutter: ^2.6.0
  geolocator: ^9.0.2

  # AR
  ar_flutter_plugin:
    path: third_party/ar_flutter_plugin/ar_flutter_plugin-0.7.3
  vector_math: ^2.2.0

  # UI helpers
  camera: ^0.11.0
  cached_network_image: ^3.3.1
  csv: ^8.0.0
  flutter_rating_bar: ^4.0.1
  http: ^1.6.0
  url_launcher: ^6.3.2
  image_picker: ^1.2.2

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/images/branding/
    - assets/models/

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  permission_handler: ^12.0.1
